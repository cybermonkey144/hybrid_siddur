<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Siddur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
</head>
<body>
    <div id="app-container">
        <div id="main-menu-view">
            <h1>Select Prayer</h1>
            <button id="shacharit-btn" data-prayer-id="shacharit">Shacharit (שחרית)</button>
            <button id="mincha-btn" data-prayer-id="mincha">Mincha (מנחה)</button>
            </div>

        <div id="nusach-selection-view" class="hidden">
            <h2>Select Nusach</h2>
            <div>
                <label for="personal-nusach-select">Personal Nusach:</label>
                <select id="personal-nusach-select"></select>
            </div>
            <div>
                <label for="community-nusach-select">Community Nusach:</label>
                <select id="community-nusach-select"></select>
            </div>
            <button id="start-prayer-btn">Start Prayer</button>
            <button id="back-to-main-menu-from-nusach-btn">Back to Main Menu</button>
        </div>

        <div id="prayer-display-view" class="hidden">
            <div id="prayer-header">
                 <button id="back-to-menu-btn">&larr; Menu</button>
                 <h2 id="prayer-title"></h2>
            </div>
            <div id="prayer-content"></div>
        </div>

        <div id="loading-indicator" class="hidden">Loading...</div>
        <div id="error-message-area" class="hidden error-message"></div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/stateManager.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/prayerEngine.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
