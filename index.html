<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Siddur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3367D6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HybridSiddur">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png"> </head>
<body>
    <header>
        <h1>Hybrid Siddur</h1>
        <button id="back-to-menu-btn" style="display:none;">Back to Menu</button>
    </header>

    <main>
        <section id="main-menu-view">
            <h2>Select a Prayer</h2>
            <ul id="prayer-list">
                </ul>
        </section>

        <section id="nusach-selection-view" style="display:none;">
            <h2 id="selected-prayer-title">Select Nusach</h2>
            <div>
                <label for="personal-nusach-select">Your Personal Nusach:</label>
                <select id="personal-nusach-select">
                    </select>
            </div>
            <div>
                <label for="community-nusach-select">Community Nusach:</label>
                <select id="community-nusach-select">
                    </select>
            </div>
            <button id="start-prayer-btn">Start Prayer</button>
        </section>

        <section id="prayer-display-view" style="display:none;">
            <h2 id="prayer-view-title">Prayer</h2>
            <div id="prayer-content-area">
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Hybrid Siddur Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
